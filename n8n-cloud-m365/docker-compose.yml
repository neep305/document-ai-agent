# M365 전용 n8n — 기본 포트 5680 (기존 n8n-cloud 5678과 충돌 방지)
services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: n8n-m365-local:latest
    container_name: n8n-m365-local
    ports:
      - "${N8N_PORT:-5680}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5680/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Seoul}
      - EXECUTIONS_TIMEOUT=${EXECUTIONS_TIMEOUT:-300}
      - EXECUTIONS_TIMEOUT_MAX=${EXECUTIONS_TIMEOUT_MAX:-600}
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - PYTHON_BINARY=/usr/bin/python3
      - NODE_FUNCTION_ALLOW_EXTERNAL=exceljs,docx
    volumes:
      - ./n8n_data:/home/node/.n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
