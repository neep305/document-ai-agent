<!-- add to cart button-->

<button
  class="btn-add-to-cart"
  data-aa-event="add_to_cart"
  data-aa-product-id="PRD-001234"
  data-aa-product-name="Super Run Pro 2"
  data-aa-category="shoes/running"
  data-aa-brand="Fluffy Sports"
  data-aa-price="99000"
  data-aa-currency="KRW"
>
  Add to Cart
</button>

<!-- purchase trigger (pay now button) -->

<button
  class="btn-purchase"
  data-aa-event="purchase"
  data-aa-order-id="ORDER-20250101-000123"
  data-aa-order-total="123000"
  data-aa-currency="KRW"
>
  Pay Now
</button>

<!-- login/signup success (form submit) -->
<button
  class="btn-login"
  data-aa-event="login_success"
>
  Login
</button>

<button
  class="btn-signup"
  data-aa-event="signup_complete"
>
  Sign Up
</button>
